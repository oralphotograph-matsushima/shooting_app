<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@200;300;400&family=Space+Mono&display=swap" rel="stylesheet">

<style>
.nm-wrap{max-width:480px;margin:0 auto;background:#f5f2ee;font-family:'Noto Serif JP',serif;font-weight:200;border-radius:12px;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,0.12);}
.nm-wrap *{box-sizing:border-box;margin:0;padding:0;}
.nm-header{background:#0a0a0a;padding:20px 20px 0;text-align:center;}
.nm-brand{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.4em;color:rgba(201,169,110,0.6);margin-bottom:6px;}
.nm-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;color:#f5f2ee;letter-spacing:0.05em;margin-bottom:20px;}
.nm-tabs{display:flex;gap:2px;}
.nm-tab{flex:1;padding:10px 4px;background:rgba(255,255,255,0.06);border:none;border-radius:6px 6px 0 0;cursor:pointer;color:rgba(245,242,238,0.4);font-size:10px;font-family:'Space Mono',monospace;letter-spacing:0.04em;transition:all 0.2s;}
.nm-tab.active{background:#f5f2ee;color:#0a0a0a;}
.nm-body{padding:24px;}
.nm-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.4em;color:#c9a96e;margin-bottom:8px;display:block;text-transform:uppercase;}
.nm-section-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:#0a0a0a;margin-bottom:4px;}
.nm-gold-line{width:28px;height:1px;background:#c9a96e;margin-bottom:24px;}
.nm-card{background:#fff;border-radius:10px;padding:18px;margin-bottom:12px;}
.nm-card-gold{border-left:3px solid #c9a96e;}
.nm-step{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #f0ede7;}
.nm-step:last-child{border-bottom:none;}
.nm-step-num{font-family:'Space Mono',monospace;font-size:10px;color:#c9a96e;padding-top:2px;min-width:22px;flex-shrink:0;}
.nm-step-title{font-size:14px;font-weight:bold;margin-bottom:4px;color:#0a0a0a;font-family:'Noto Serif JP',serif;}
.nm-step-body{font-size:12px;color:#666;line-height:1.8;}
.nm-setting-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.nm-setting-item{background:#f7f5f1;padding:10px;border-radius:8px;}
.nm-setting-label{font-family:'Space Mono',monospace;font-size:9px;color:#aaa;margin-bottom:4px;}
.nm-setting-value{font-size:12px;font-weight:bold;color:#0a0a0a;}
.nm-dark-cta{background:#0a0a0a;border-radius:12px;padding:24px;cursor:pointer;margin-top:4px;position:relative;overflow:hidden;}
.nm-dark-cta-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.3em;color:#c9a96e;margin-bottom:10px;}
.nm-dark-cta-title{font-family:'Cormorant Garamond',serif;font-size:20px;color:#f5f2ee;font-weight:300;margin-bottom:8px;line-height:1.4;}
.nm-dark-cta-body{font-size:12px;color:rgba(245,242,238,0.45);line-height:1.9;margin-bottom:16px;}
.nm-features{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.nm-feature{font-family:'Space Mono',monospace;font-size:9px;color:rgba(201,169,110,0.8);}
.nm-btn-gold{display:inline-flex;align-items:center;gap:6px;padding:12px 24px;background:#c9a96e;color:#0a0a0a;font-size:11px;font-family:'Space Mono',monospace;border-radius:4px;font-weight:bold;border:none;cursor:pointer;}
.nm-btn-outline{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border:1px solid #c9a96e;color:#c9a96e;font-size:10px;font-family:'Space Mono',monospace;border-radius:4px;background:transparent;cursor:pointer;text-decoration:none;}
.nm-lock-box{background:#fff;border-radius:12px;padding:28px;text-align:center;}
.nm-lock-icon{width:48px;height:48px;background:#f7f5f1;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:20px;}
.nm-lock-title{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:300;margin-bottom:8px;color:#0a0a0a;}
.nm-lock-sub{font-size:12px;color:#888;line-height:1.9;margin-bottom:20px;}
.nm-input{width:100%;padding:12px;background:#f7f5f1;border:none;border-radius:8px;text-align:center;font-size:13px;letter-spacing:0.2em;margin-bottom:10px;font-family:'Space Mono',monospace;outline:none;}
.nm-btn-black{width:100%;padding:13px;background:#0a0a0a;color:#f5f2ee;border:none;border-radius:8px;font-size:11px;font-family:'Space Mono',monospace;letter-spacing:0.2em;cursor:pointer;}
.nm-error{margin-top:10px;font-size:11px;color:#c0392b;font-family:'Space Mono',monospace;}
.nm-success{margin-top:10px;font-size:11px;color:#27ae60;font-family:'Space Mono',monospace;}
.nm-blurred{filter:blur(4px);opacity:0.35;pointer-events:none;user-select:none;}
.nm-locked-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.nm-locked-badge{background:rgba(10,10,10,0.75);padding:8px 18px;border-radius:20px;font-family:'Space Mono',monospace;font-size:10px;color:#c9a96e;}
.nm-purchase-note{margin-top:16px;padding:18px;border:1px solid rgba(201,169,110,0.2);border-radius:10px;text-align:center;}
.nm-purchase-note p{font-size:12px;color:#888;line-height:1.9;margin-bottom:14px;}
.nm-footer{padding:20px;border-top:1px solid rgba(26,24,20,0.08);text-align:center;}
.nm-line-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:#06C755;color:#fff;font-size:11px;font-family:'Space Mono',monospace;text-decoration:none;border-radius:4px;}
</style>

<div class="nm-wrap" id="nm-app">

  <!-- ヘッダー -->
  <div class="nm-header">
    <p class="nm-brand">NOSTALGISTA</p>
    <h1 class="nm-title">Digital Manual</h1>
    <div class="nm-tabs">
      <button class="nm-tab active" onclick="nmSetTab('free')">基本ガイド</button>
      <button class="nm-tab" onclick="nmSetTab('purchaser')">🔒 購入者専用</button>
      <button class="nm-tab" onclick="nmSetTab('wireless')">🔒 Wireless Pro</button>
    </div>
  </div>

  <!-- ボディ -->
  <div class="nm-body" id="nm-body"></div>

  <!-- フッター -->
  <div class="nm-footer">
    <a href="https://lin.ee/u7blH2E" class="nm-line-btn">LINEで相談する</a>
  </div>

</div>

<script>
(function(){
  // ── 設定（コードをここで変更してください）──
  var CODES = { purchaser: "surgiflip", wireless: "wireless2024" };

  // ── 状態管理 ──
  var state = { tab: "free", unlocked: { purchaser: false, wireless: false } };

  function setTab(tab){ state.tab = tab; render(); }
  window.nmSetTab = setTab;

  function tryUnlock(target){
    var inp = document.getElementById("nm-code-input");
    if(!inp) return;
    var val = inp.value.toLowerCase().trim();
    var msg = document.getElementById("nm-msg");
    if(val === CODES[target]){
      state.unlocked[target] = true;
      if(msg){ msg.className="nm-success"; msg.textContent="アンロックしました！"; }
      setTimeout(function(){ render(); }, 800);
    } else {
      if(msg){ msg.className="nm-error"; msg.textContent="コードが正しくありません"; }
    }
  }
  window.nmTryUnlock = tryUnlock;

  // ── レンダリング ──
  function render(){
    // タブの見た目
    var tabs = document.querySelectorAll(".nm-tab");
    var labels = ["free","purchaser","wireless"];
    var tabLabels = ["基本ガイド","🔒 購入者専用","🔒 Wireless Pro"];
    tabs.forEach(function(t,i){
      t.classList.toggle("active", labels[i] === state.tab);
      var id = labels[i];
      var locked = (id==="purchaser"&&!state.unlocked.purchaser)||(id==="wireless"&&!state.unlocked.wireless);
      t.textContent = (locked && id!=="free" ? "🔒 " : "") + ["基本ガイド","購入者専用","Wireless Pro"][i];
    });

    var body = document.getElementById("nm-body");
    if(state.tab === "free") body.innerHTML = renderFree();
    else if(state.tab === "purchaser") body.innerHTML = state.unlocked.purchaser ? renderPurchaserUnlocked() : renderLock("purchaser","購入者専用ガイド","お届けした機材に同梱の<br>アンロックコードを入力してください。");
    else body.innerHTML = state.unlocked.wireless ? renderWirelessUnlocked() : renderWirelessLocked();
  }

  function renderFree(){
    return '<span class="nm-label">Basic</span>'
    +'<h2 class="nm-section-title">規格性撮影の基本</h2>'
    +'<div class="nm-gold-line"></div>'
    +[["01","ピントは側切歯に合わせる","F22〜25の絞りで被写界深度を稼ぎながら、側切歯を基準点にAFをロック。"],
      ["02","撮影倍率は固定で運用する","毎回同じ倍率で撮ることで経過比較が可能に。レンズにテープでマーキングを。"],
      ["03","バリアングルを全開にする","液晶を全開にし、口腔内と平行に構えることで歪みのない正面像が撮れる。"]
    ].map(function(s){ return '<div class="nm-card nm-card-gold" style="margin-bottom:10px;">'
      +'<div style="display:flex;gap:12px;"><span class="nm-step-num">'+s[0]+'</span>'
      +'<div><p class="nm-step-title">'+s[1]+'</p><p class="nm-step-body">'+s[2]+'</p></div></div></div>'; }).join("")
    +'<div class="nm-dark-cta" onclick="nmSetTab(\'purchaser\')">'
    +'<p class="nm-dark-cta-label">PURCHASER ONLY</p>'
    +'<p class="nm-dark-cta-title">購入者限定の<br>詳細設定ガイドへ</p>'
    +'<span class="nm-btn-outline" style="margin-top:4px;">アンロック →</span></div>';
  }

  function renderPurchaserUnlocked(){
    return '<span class="nm-label">Purchaser</span>'
    +'<h2 class="nm-section-title">詳細設定ガイド</h2>'
    +'<div class="nm-gold-line"></div>'
    +'<div class="nm-card">'
    +'<p class="nm-label">RECOMMENDED SETTINGS</p>'
    +'<div class="nm-setting-grid">'
    +[["Mode","M（マニュアル）"],["Shutter","1/160"],["F値","F22〜25"],["ISO","400〜800"],["WB","フラッシュ"],["AF","1点スポット"]]
    .map(function(s){ return '<div class="nm-setting-item"><p class="nm-setting-label">'+s[0]+'</p><p class="nm-setting-value">'+s[1]+'</p></div>'; }).join("")
    +'</div>'
    +'<div style="background:#f0ede7;padding:12px;border-radius:8px;font-size:12px;color:#555;line-height:1.8;">⚠ バリアングルを全開にし、口腔内と平行に構えてください。</div>'
    +'</div>'
    +'<div class="nm-card">'
    +'<p class="nm-label">9-SHOT PROTOCOL</p>'
    +["正面","右上","右下","左上","左下","上顎（ミラー）","前歯あおり","下顎（ミラー）","正面半開口"]
    .map(function(s,i){ return '<div class="nm-step"><span class="nm-step-num">0'+(i+1)+'</span><span style="font-size:13px;color:#333;">'+s+'</span></div>'; }).join("")
    +'</div>'
    +'<div class="nm-dark-cta" onclick="nmSetTab(\'wireless\')">'
    +'<p class="nm-dark-cta-label">WIRELESS CONNECT PRO</p>'
    +'<h3 class="nm-dark-cta-title">撮った瞬間、<br><em style="color:#c9a96e;font-style:italic;">すべてが自動になる。</em></h3>'
    +'<p class="nm-dark-cta-body">SDカードを抜く作業をゼロに。撮影後10秒でスライドが自動完成し、患者コンサルの質が根本から変わります。</p>'
    +'<div class="nm-features"><span class="nm-feature">★ 自動転送</span><span class="nm-feature">★ AI品質チェック</span><span class="nm-feature">★ スライド自動生成</span></div>'
    +'<button class="nm-btn-gold">詳細を見る →</button></div>';
  }

  function renderWirelessLocked(){
    return '<div style="background:#0a0a0a;border-radius:12px;padding:24px;margin-bottom:16px;">'
    +'<p class="nm-label" style="color:rgba(201,169,110,0.5);">WIRELESS CONNECT PRO</p>'
    +'<h2 style="font-family:\'Cormorant Garamond\',serif;font-size:22px;color:#f5f2ee;font-weight:300;line-height:1.3;margin-bottom:16px;">撮影した瞬間、<br><em style="color:#c9a96e;">すべてが自動になる。</em></h2>'
    +'<div style="position:relative;">'
    +'<div class="nm-blurred">'
    +["NASへFTP自動転送（1〜2秒）","AI品質チェック（ぼけ・露出・ミラー曇り）","Googleスライド自動生成","患者フォルダ自動作成","iPadへのリアルタイム通知"]
    .map(function(f){ return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;"><span style="color:#c9a96e;">✓</span><span style="font-size:13px;color:#f5f2ee;">'+f+'</span></div>'; }).join("")
    +'</div>'
    +'<div class="nm-locked-overlay"><div class="nm-locked-badge">🔒 LOCKED</div></div>'
    +'</div></div>'
    +renderLock("wireless","アンロックコードを入力","WirelessConnect Pro のアクセスコードを<br>入力してください。")
    +'<div class="nm-purchase-note"><p>コードをお持ちでない方は<br>WirelessConnect Pro Setをご購入ください。</p>'
    +'<a href="https://nostalgista.co.jp/?page_id=10346" class="nm-btn-outline">詳細・購入はこちら →</a></div>';
  }

  function renderWirelessUnlocked(){
    return '<span class="nm-label">Wireless Pro</span>'
    +'<h2 class="nm-section-title">運用マニュアル</h2>'
    +'<div class="nm-gold-line"></div>'
    +'<div class="nm-card">'
    +'<p class="nm-label">SETUP FLOW</p>'
    +[["01","NASをLANに接続","UGREEN NASのLANケーブルをルーターに挿す。電源ON後、約1分で起動完了。"],
      ["02","カメラのFTP設定","Z50IIのネットワーク設定からNASのIPアドレスを入力。自動転送をONに。"],
      ["03","QRで患者フォルダ作成","アプリで患者番号を入力→QRを表示→カメラで撮影。フォルダが自動生成される。"],
      ["04","撮影→自動転送","シャッターを押した瞬間、NASへ転送開始。1〜2秒でiPadに通知が届く。"]
    ].map(function(s){ return '<div class="nm-step"><span class="nm-step-num">'+s[0]+'</span>'
      +'<div><p class="nm-step-title">'+s[1]+'</p><p class="nm-step-body">'+s[2]+'</p></div></div>'; }).join("")
    +'</div>'
    +'<div class="nm-card" style="background:#f0ede7;">'
    +'<p class="nm-label">TROUBLESHOOTING</p>'
    +'<p style="font-size:12px;color:#555;line-height:2;">転送できない場合はIPアドレスを確認。漢字フォルダは使用不可。ルーターは二重ルーターを避けブリッジモードに設定してください。</p>'
    +'</div>';
  }

  function renderLock(target, title, subtitle){
    return '<div class="nm-lock-box">'
    +'<div class="nm-lock-icon">🔒</div>'
    +'<h3 class="nm-lock-title">'+title+'</h3>'
    +'<p class="nm-lock-sub">'+subtitle+'</p>'
    +'<input class="nm-input" id="nm-code-input" type="text" placeholder="コードを入力">'
    +'<button class="nm-btn-black" onclick="nmTryUnlock(\''+target+'\')">認証する</button>'
    +'<div id="nm-msg"></div>'
    +'</div>';
  }

  // 初期レンダリング
  render();
})();
</script>
