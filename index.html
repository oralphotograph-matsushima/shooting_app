<style>

import { Lock, Wifi, BookOpen, Camera, ChevronRight, Check, AlertCircle, Star } from "lucide-react";

const GOLD = "#c9a96e";
const BLACK = "#0a0a0a";
const CREAM = "#f5f2ee";

// コード設定（実際のコードに変更してください）
const CODES = {
  purchaser: "sfl",
  wireless: "wc202603",
};

export default function App() {
  const [tab, setTab] = useState("free");
  const [unlocked, setUnlocked] = useState({ purchaser: false, wireless: false });
  const [code, setCode] = useState("");
  const [error, setError] = useState("");
  const [success, setSuccess] = useState("");

  const handleUnlock = (target) => {
    if (code.toLowerCase().trim() === CODES[target]) {
      setUnlocked((prev) => ({ ...prev, [target]: true }));
      setSuccess("アンロックしました");
      setError("");
      setCode("");
      setTimeout(() => setSuccess(""), 2000);
    } else {
      setError("コードが正しくありません");
      setSuccess("");
    }
  };

  return (
    <div style={{ background: CREAM, minHeight: "100vh", fontFamily: "'Georgia', serif", maxWidth: 480, margin: "0 auto", boxShadow: "0 0 60px rgba(0,0,0,0.15)" }}>

      {/* ヘッダー */}
      <div style={{ background: BLACK, padding: "24px 24px 0", textAlign: "center" }}>
        <p style={{ fontFamily: "monospace", fontSize: 9, letterSpacing: "0.4em", color: "rgba(201,169,110,0.7)", textTransform: "uppercase", marginBottom: 8 }}>Nostalgista</p>
        <h1 style={{ fontFamily: "'Georgia', serif", fontSize: 22, fontWeight: 300, color: CREAM, letterSpacing: "0.05em", marginBottom: 24 }}>
          Digital Manual
        </h1>

        {/* タブ */}
        <div style={{ display: "flex", gap: 2 }}>
          {[
            { id: "free", label: "基本ガイド", icon: BookOpen },
            { id: "purchaser", label: "購入者専用", icon: Camera },
            { id: "wireless", label: "Wireless Pro", icon: Wifi },
          ].map(({ id, label, icon: Icon }) => {
            const isActive = tab === id;
            const isLocked = (id === "purchaser" && !unlocked.purchaser) || (id === "wireless" && !unlocked.wireless);
            return (
              <button
                key={id}
                onClick={() => setTab(id)}
                style={{
                  flex: 1,
                  padding: "10px 4px",
                  background: isActive ? CREAM : "rgba(255,255,255,0.07)",
                  border: "none",
                  borderRadius: "8px 8px 0 0",
                  cursor: "pointer",
                  color: isActive ? BLACK : "rgba(245,242,238,0.4)",
                  fontSize: 10,
                  fontFamily: "monospace",
                  letterSpacing: "0.05em",
                  display: "flex",
                  flexDirection: "column",
                  alignItems: "center",
                  gap: 4,
                  transition: "all 0.2s",
                }}
              >
                <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                  <Icon size={12} />
                  {isLocked && <Lock size={9} style={{ color: GOLD, opacity: 0.8 }} />}
                </div>
                <span>{label}</span>
              </button>
            );
          })}
        </div>
      </div>

      {/* コンテンツ */}
      <div style={{ padding: 24 }}>

        {/* ── 基本ガイド ── */}
        {tab === "free" && (
          <div>
            <Section label="Basic" title="規格性撮影の基本" />

            <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 32 }}>
              {[
                { n: "01", title: "ピントは側切歯に合わせる", body: "F22〜25の絞りで被写界深度を稼ぎながら、側切歯を基準点にオートフォーカスをロックする。" },
                { n: "02", title: "撮影倍率は固定で運用する", body: "毎回同じ倍率で撮ることで経過比較が可能になる。レンズのズームリングにテープでマーキングを。" },
                { n: "03", title: "バリアングルを全開にする", body: "液晶モニターを全開にし、カメラを口腔内と平行に構えることで歪みのない正面像が撮影できる。" },
              ].map(({ n, title, body }) => (
                <div key={n} style={{ background: "#fff", borderRadius: 12, padding: "20px 20px", borderLeft: `3px solid ${GOLD}` }}>
                  <div style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>
                    <span style={{ fontFamily: "monospace", fontSize: 10, color: GOLD, minWidth: 24, paddingTop: 2 }}>{n}</span>
                    <div>
                      <p style={{ fontSize: 14, fontWeight: "bold", marginBottom: 6, color: BLACK }}>{title}</p>
                      <p style={{ fontSize: 12, color: "#666", lineHeight: 1.8 }}>{body}</p>
                    </div>
                  </div>
                </div>
              ))}
            </div>

            {/* 購入者へ誘導 */}
            <div
              onClick={() => setTab("purchaser")}
              style={{ background: BLACK, borderRadius: 16, padding: 24, textAlign: "center", cursor: "pointer", position: "relative", overflow: "hidden" }}
            >
              <div style={{ position: "absolute", top: -20, right: -20, width: 100, height: 100, background: `radial-gradient(circle, rgba(201,169,110,0.15), transparent)` }} />
              <p style={{ fontFamily: "monospace", fontSize: 9, letterSpacing: "0.3em", color: GOLD, marginBottom: 12 }}>PURCHASER ONLY</p>
              <p style={{ fontSize: 14, color: CREAM, marginBottom: 16, lineHeight: 1.7, fontWeight: 300 }}>
                カメラ購入者限定の<br />詳細設定ガイドを見る
              </p>
              <div style={{ display: "inline-flex", alignItems: "center", gap: 8, padding: "10px 24px", border: `1px solid ${GOLD}`, color: GOLD, fontSize: 11, fontFamily: "monospace", letterSpacing: "0.15em", borderRadius: 4 }}>
                アンロック <ChevronRight size={12} />
              </div>
            </div>
          </div>
        )}

        {/* ── 購入者専用 ── */}
        {tab === "purchaser" && (
          <div>
            {!unlocked.purchaser ? (
              <LockScreen
                dark={false}
                title="購入者専用ガイド"
                subtitle={"お届けした機材に同梱の\nアンロックコードを入力してください。"}
                code={code}
                setCode={setCode}
                error={error}
                success={success}
                onUnlock={() => handleUnlock("purchaser")}
              />
            ) : (
              <div>
                <Section label="Purchaser" title="詳細設定ガイド" />

                {/* 推奨設定 */}
                <div style={{ background: "#fff", borderRadius: 12, padding: 20, marginBottom: 16 }}>
                  <p style={{ fontFamily: "monospace", fontSize: 9, letterSpacing: "0.3em", color: GOLD, marginBottom: 16 }}>RECOMMENDED SETTINGS</p>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
                    {[
                      { label: "Mode", value: "M（マニュアル）" },
                      { label: "Shutter", value: "1/160" },
                      { label: "F値", value: "F22〜25" },
                      { label: "ISO", value: "400〜800" },
                      { label: "WB", value: "フラッシュ" },
                      { label: "AF", value: "1点スポット" },
                    ].map(({ label, value }) => (
                      <div key={label} style={{ background: "#f7f5f1", padding: "12px", borderRadius: 8 }}>
                        <p style={{ fontFamily: "monospace", fontSize: 9, color: "#aaa", marginBottom: 4 }}>{label}</p>
                        <p style={{ fontSize: 13, fontWeight: "bold", color: BLACK }}>{value}</p>
                      </div>
                    ))}
                  </div>
                  <div style={{ background: "#f0ede7", padding: 14, borderRadius: 8, display: "flex", gap: 10 }}>
                    <AlertCircle size={14} style={{ color: GOLD, flexShrink: 0, marginTop: 2 }} />
                    <p style={{ fontSize: 12, color: "#555", lineHeight: 1.8 }}>液晶は必ずバリアングルを全開にし、口腔内と平行に構えてください。</p>
                  </div>
                </div>

                {/* 9枚法の順番 */}
                <div style={{ background: "#fff", borderRadius: 12, padding: 20, marginBottom: 24 }}>
                  <p style={{ fontFamily: "monospace", fontSize: 9, letterSpacing: "0.3em", color: GOLD, marginBottom: 16 }}>9-SHOT PROTOCOL</p>
                  {["正面", "右上", "右下", "左上", "左下", "上顎（ミラー）", "前歯あおり", "下顎（ミラー）", "正面半開口"].map((s, i) => (
                    <div key={i} style={{ display: "flex", gap: 12, alignItems: "center", padding: "8px 0", borderBottom: i < 8 ? "1px solid #f0ede7" : "none" }}>
                      <span style={{ fontFamily: "monospace", fontSize: 10, color: GOLD, minWidth: 20 }}>0{i + 1}</span>
                      <span style={{ fontSize: 13, color: "#333" }}>{s}</span>
                    </div>
                  ))}
                </div>

                {/* Wireless Connectへの誘導 */}
                <div
                  onClick={() => setTab("wireless")}
                  style={{ background: BLACK, borderRadius: 16, padding: 28, cursor: "pointer", position: "relative", overflow: "hidden" }}
                >
                  <div style={{ position: "absolute", top: -30, right: -30, width: 120, height: 120, background: `radial-gradient(circle, rgba(201,169,110,0.12), transparent)` }} />
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
                    <Wifi size={14} style={{ color: GOLD }} />
                    <p style={{ fontFamily: "monospace", fontSize: 9, letterSpacing: "0.3em", color: GOLD }}>WIRELESS CONNECT PRO</p>
                  </div>
                  <p style={{ fontSize: 20, color: CREAM, fontWeight: 300, marginBottom: 8, lineHeight: 1.4 }}>
                    撮った瞬間、<br />iPadに届く。
                  </p>
                  <p style={{ fontSize: 12, color: "rgba(245,242,238,0.45)", lineHeight: 1.8, marginBottom: 20 }}>
                    SDカードを抜く作業を完全になくし、撮影後10秒でスライドが自動完成。患者コンサルの質が根本から変わります。
                  </p>
                  <div style={{ display: "flex", gap: 16, marginBottom: 20 }}>
                    {["自動転送", "AI品質チェック", "スライド自動生成"].map((f) => (
                      <div key={f} style={{ display: "flex", alignItems: "center", gap: 4 }}>
                        <Star size={10} style={{ color: GOLD }} />
                        <span style={{ fontFamily: "monospace", fontSize: 9, color: "rgba(201,169,110,0.8)" }}>{f}</span>
                      </div>
                    ))}
                  </div>
                  <div style={{ display: "inline-flex", alignItems: "center", gap: 8, padding: "12px 28px", background: GOLD, color: BLACK, fontSize: 11, fontFamily: "monospace", letterSpacing: "0.15em", borderRadius: 4, fontWeight: "bold" }}>
                    詳細を見る <ChevronRight size={12} />
                  </div>
                </div>
              </div>
            )}
          </div>
        )}

        {/* ── Wireless Connect Pro ── */}
        {tab === "wireless" && (
          <div>
            {!unlocked.wireless ? (
              <div>
                {/* プレミアム感のある予告エリア */}
                <div style={{ background: BLACK, borderRadius: 16, padding: 28, marginBottom: 20, position: "relative", overflow: "hidden" }}>
                  <div style={{ position: "absolute", inset: 0, background: "radial-gradient(ellipse at 70% 30%, rgba(201,169,110,0.08), transparent 60%)" }} />
                  <p style={{ fontFamily: "monospace", fontSize: 9, letterSpacing: "0.4em", color: "rgba(201,169,110,0.6)", marginBottom: 20 }}>WIRELESS CONNECT PRO</p>
                  <h2 style={{ fontSize: 26, color: CREAM, fontWeight: 300, lineHeight: 1.3, marginBottom: 16 }}>
                    撮影した瞬間、<br /><em style={{ color: GOLD, fontStyle: "italic" }}>すべてが自動になる。</em>
                  </h2>

                  {/* 機能一覧（ぼかしてプレビュー） */}
                  <div style={{ position: "relative", marginBottom: 24 }}>
                    <div style={{ display: "flex", flexDirection: "column", gap: 10, filter: "blur(4px)", opacity: 0.4, pointerEvents: "none", userSelect: "none" }}>
                      {["NASへFTP自動転送（1〜2秒）", "AI品質チェック（ぼけ・露出・ミラー曇り）", "Googleスライド自動生成", "患者フォルダ自動作成", "iPadへのリアルタイム通知"].map((f) => (
                        <div key={f} style={{ display: "flex", gap: 10, alignItems: "center" }}>
                          <Check size={12} style={{ color: GOLD, flexShrink: 0 }} />
                          <span style={{ fontSize: 13, color: CREAM }}>{f}</span>
                        </div>
                      ))}
                    </div>
                    <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
                      <div style={{ background: "rgba(10,10,10,0.7)", padding: "8px 20px", borderRadius: 20, display: "flex", alignItems: "center", gap: 8 }}>
                        <Lock size={12} style={{ color: GOLD }} />
                        <span style={{ fontFamily: "monospace", fontSize: 10, color: GOLD }}>LOCKED</span>
                      </div>
                    </div>
                  </div>
                </div>

                <LockScreen
                  dark={false}
                  title="アンロックコードを入力"
                  subtitle={"WirelessConnect Pro のアクセスコードを\n入力してください。"}
                  code={code}
                  setCode={setCode}
                  error={error}
                  success={success}
                  onUnlock={() => handleUnlock("wireless")}
                />

                {/* 購入を促すCTA */}
                <div style={{ marginTop: 20, padding: 20, border: `1px solid rgba(201,169,110,0.25)`, borderRadius: 12, textAlign: "center" }}>
                  <p style={{ fontSize: 12, color: "#888", lineHeight: 1.9, marginBottom: 16 }}>
                    コードをお持ちでない方は<br />WirelessConnect Pro Setをご購入ください。
                  </p>
                  <a
                    href="https://nostalgista.co.jp/?page_id=10346"
                    style={{ display: "inline-flex", alignItems: "center", gap: 8, padding: "12px 28px", border: `1px solid ${GOLD}`, color: GOLD, fontSize: 11, fontFamily: "monospace", letterSpacing: "0.15em", textDecoration: "none", borderRadius: 4 }}
                  >
                    詳細・購入はこちら <ChevronRight size={12} />
                  </a>
                </div>
              </div>
            ) : (
              <div>
                <Section label="Wireless Pro" title="運用マニュアル" />

                <div style={{ background: "#fff", borderRadius: 12, padding: 20, marginBottom: 16 }}>
                  <p style={{ fontFamily: "monospace", fontSize: 9, letterSpacing: "0.3em", color: GOLD, marginBottom: 16 }}>SETUP FLOW</p>
                  {[
                    { step: "01", title: "NASをLANに接続", body: "UGREEN NASのLANケーブルをルーターに挿す。電源ON後、約1分で起動完了。" },
                    { step: "02", title: "カメラのFTP設定", body: "Z50IIのネットワーク設定からNASのIPアドレスを入力。「撮影後自動転送」をONに。" },
                    { step: "03", title: "QRコードで患者フォルダ作成", body: "WirelessConnectアプリで患者番号を入力→QRを表示→カメラで撮影。フォルダが自動生成される。" },
                    { step: "04", title: "撮影→自動転送", body: "シャッターを押した瞬間、NASへ転送開始。1〜2秒でiPadに通知が届く。" },
                  ].map(({ step, title, body }) => (
                    <div key={step} style={{ display: "flex", gap: 16, padding: "16px 0", borderBottom: step !== "04" ? "1px solid #f0ede7" : "none" }}>
                      <span style={{ fontFamily: "monospace", fontSize: 10, color: GOLD, minWidth: 24, paddingTop: 2 }}>{step}</span>
                      <div>
                        <p style={{ fontSize: 14, fontWeight: "bold", marginBottom: 4, color: BLACK }}>{title}</p>
                        <p style={{ fontSize: 12, color: "#666", lineHeight: 1.8 }}>{body}</p>
                      </div>
                    </div>
                  ))}
                </div>

                <div style={{ background: "#f0ede7", borderRadius: 12, padding: 20 }}>
                  <p style={{ fontFamily: "monospace", fontSize: 9, letterSpacing: "0.3em", color: "#888", marginBottom: 12 }}>TROUBLESHOOTING</p>
                  <p style={{ fontSize: 12, color: "#555", lineHeight: 2 }}>
                    転送できない場合はIPアドレスを確認。漢字フォルダは使用不可。ルーターは二重ルーターを避けブリッジモードに。
                  </p>
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      {/* フッター */}
      <div style={{ padding: "24px", borderTop: "1px solid rgba(26,24,20,0.08)", textAlign: "center" }}>
        <p style={{ fontFamily: "monospace", fontSize: 9, color: "#bbb", letterSpacing: "0.2em", marginBottom: 16 }}>SUPPORT</p>
        <a
          href="https://lin.ee/u7blH2E"
          style={{ display: "inline-flex", alignItems: "center", gap: 8, padding: "14px 32px", background: "#06C755", color: "#fff", fontSize: 12, fontFamily: "monospace", letterSpacing: "0.1em", textDecoration: "none", borderRadius: 4 }}
        >
          LINEで相談する
        </a>
      </div>
    </div>
  );
}

function Section({ label, title }) {
  return (
    <div style={{ marginBottom: 24 }}>
      <p style={{ fontFamily: "monospace", fontSize: 9, letterSpacing: "0.4em", color: GOLD, marginBottom: 8 }}>{label.toUpperCase()}</p>
      <h2 style={{ fontSize: 22, fontWeight: 300, color: BLACK, letterSpacing: "-0.01em" }}>{title}</h2>
      <div style={{ width: 32, height: 1, background: GOLD, marginTop: 12 }} />
    </div>
  );
}

function LockScreen({ title, subtitle, code, setCode, error, success, onUnlock }) {
  return (
    <div style={{ background: "#fff", borderRadius: 16, padding: 28, textAlign: "center" }}>
      <div style={{ width: 56, height: 56, background: "#f7f5f1", borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 20px" }}>
        <Lock size={24} style={{ color: GOLD }} />
      </div>
      <h3 style={{ fontSize: 16, fontWeight: 300, marginBottom: 8, color: BLACK }}>{title}</h3>
      <p style={{ fontSize: 12, color: "#888", lineHeight: 1.9, marginBottom: 24, whiteSpace: "pre-line" }}>{subtitle}</p>
      <input
        type="text"
        value={code}
        onChange={(e) => setCode(e.target.value)}
        onKeyDown={(e) => e.key === "Enter" && onUnlock()}
        placeholder="コードを入力"
        style={{ width: "100%", padding: "14px", background: "#f7f5f1", border: "none", borderRadius: 8, textAlign: "center", fontSize: 14, letterSpacing: "0.2em", outline: "none", marginBottom: 12, fontFamily: "monospace" }}
      />
      <button
        onClick={onUnlock}
        style={{ width: "100%", padding: "14px", background: BLACK, color: CREAM, border: "none", borderRadius: 8, fontSize: 12, fontFamily: "monospace", letterSpacing: "0.2em", cursor: "pointer" }}
      >
        認証する
      </button>
      {error && <p style={{ marginTop: 12, fontSize: 11, color: "#c0392b" }}>{error}</p>}
      {success && <p style={{ marginTop: 12, fontSize: 11, color: "#27ae60" }}>{success}</p>}
    </div>
  );
}

.nm-btn-gold{display:inline-flex;align-items:center;gap:6px;padding:12px 24px;background:#c9a96e;color:#0a0a0a;font-size:11px;font-family:'Space Mono',monospace;border-radius:4px;font-weight:bold;border:none;cursor:pointer;}
.nm-btn-outline{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border:1px solid #c9a96e;color:#c9a96e;font-size:10px;font-family:'Space Mono',monospace;border-radius:4px;background:transparent;cursor:pointer;text-decoration:none;}
.nm-lock-box{background:#fff;border-radius:12px;padding:28px;text-align:center;}
.nm-lock-icon{width:48px;height:48px;background:#f7f5f1;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:20px;}
.nm-lock-title{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:300;margin-bottom:8px;color:#0a0a0a;}
.nm-lock-sub{font-size:12px;color:#888;line-height:1.9;margin-bottom:20px;}
.nm-input{width:100%;padding:12px;background:#f7f5f1;border:none;border-radius:8px;text-align:center;font-size:13px;letter-spacing:0.2em;margin-bottom:10px;font-family:'Space Mono',monospace;outline:none;}
.nm-btn-black{width:100%;padding:13px;background:#0a0a0a;color:#f5f2ee;border:none;border-radius:8px;font-size:11px;font-family:'Space Mono',monospace;letter-spacing:0.2em;cursor:pointer;}
.nm-error{margin-top:10px;font-size:11px;color:#c0392b;font-family:'Space Mono',monospace;}
.nm-success{margin-top:10px;font-size:11px;color:#27ae60;font-family:'Space Mono',monospace;}
.nm-blurred{filter:blur(4px);opacity:0.35;pointer-events:none;user-select:none;}
.nm-locked-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.nm-locked-badge{background:rgba(10,10,10,0.75);padding:8px 18px;border-radius:20px;font-family:'Space Mono',monospace;font-size:10px;color:#c9a96e;}
.nm-purchase-note{margin-top:16px;padding:18px;border:1px solid rgba(201,169,110,0.2);border-radius:10px;text-align:center;}
.nm-purchase-note p{font-size:12px;color:#888;line-height:1.9;margin-bottom:14px;}
.nm-footer{padding:20px;border-top:1px solid rgba(26,24,20,0.08);text-align:center;}
.nm-line-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:#06C755;color:#fff;font-size:11px;font-family:'Space Mono',monospace;text-decoration:none;border-radius:4px;}
</style>

<div class="nm-wrap" id="nm-app">

  <!-- ヘッダー -->
  <div class="nm-header">
    <p class="nm-brand">NOSTALGISTA</p>
    <h1 class="nm-title">Digital Manual</h1>
    <div class="nm-tabs">
      <button class="nm-tab active" onclick="nmSetTab('free')">基本ガイド</button>
      <button class="nm-tab" onclick="nmSetTab('purchaser')">🔒 購入者専用</button>
      <button class="nm-tab" onclick="nmSetTab('wireless')">🔒 Wireless Pro</button>
    </div>
  </div>

  <!-- ボディ -->
  <div class="nm-body" id="nm-body"></div>

  <!-- フッター -->
  <div class="nm-footer">
    <a href="https://lin.ee/u7blH2E" class="nm-line-btn">LINEで相談する</a>
  </div>

</div>

<script>
(function(){
  // ── 設定（コードをここで変更してください）──
  var CODES = { purchaser: "surgiflip", wireless: "wireless2024" };

  // ── 状態管理 ──
  var state = { tab: "free", unlocked: { purchaser: false, wireless: false } };

  function setTab(tab){ state.tab = tab; render(); }
  window.nmSetTab = setTab;

  function tryUnlock(target){
    var inp = document.getElementById("nm-code-input");
    if(!inp) return;
    var val = inp.value.toLowerCase().trim();
    var msg = document.getElementById("nm-msg");
    if(val === CODES[target]){
      state.unlocked[target] = true;
      if(msg){ msg.className="nm-success"; msg.textContent="アンロックしました！"; }
      setTimeout(function(){ render(); }, 800);
    } else {
      if(msg){ msg.className="nm-error"; msg.textContent="コードが正しくありません"; }
    }
  }
  window.nmTryUnlock = tryUnlock;

  // ── レンダリング ──
  function render(){
    // タブの見た目
    var tabs = document.querySelectorAll(".nm-tab");
    var labels = ["free","purchaser","wireless"];
    var tabLabels = ["基本ガイド","🔒 購入者専用","🔒 Wireless Pro"];
    tabs.forEach(function(t,i){
      t.classList.toggle("active", labels[i] === state.tab);
      var id = labels[i];
      var locked = (id==="purchaser"&&!state.unlocked.purchaser)||(id==="wireless"&&!state.unlocked.wireless);
      t.textContent = (locked && id!=="free" ? "🔒 " : "") + ["基本ガイド","購入者専用","Wireless Pro"][i];
    });

    var body = document.getElementById("nm-body");
    if(state.tab === "free") body.innerHTML = renderFree();
    else if(state.tab === "purchaser") body.innerHTML = state.unlocked.purchaser ? renderPurchaserUnlocked() : renderLock("purchaser","購入者専用ガイド","お届けした機材に同梱の<br>アンロックコードを入力してください。");
    else body.innerHTML = state.unlocked.wireless ? renderWirelessUnlocked() : renderWirelessLocked();
  }

  function renderFree(){
    return '<span class="nm-label">Basic</span>'
    +'<h2 class="nm-section-title">規格性撮影の基本</h2>'
    +'<div class="nm-gold-line"></div>'
    +[["01","ピントは側切歯に合わせる","F22〜25の絞りで被写界深度を稼ぎながら、側切歯を基準点にAFをロック。"],
      ["02","撮影倍率は固定で運用する","毎回同じ倍率で撮ることで経過比較が可能に。レンズにテープでマーキングを。"],
      ["03","バリアングルを全開にする","液晶を全開にし、口腔内と平行に構えることで歪みのない正面像が撮れる。"]
    ].map(function(s){ return '<div class="nm-card nm-card-gold" style="margin-bottom:10px;">'
      +'<div style="display:flex;gap:12px;"><span class="nm-step-num">'+s[0]+'</span>'
      +'<div><p class="nm-step-title">'+s[1]+'</p><p class="nm-step-body">'+s[2]+'</p></div></div></div>'; }).join("")
    +'<div class="nm-dark-cta" onclick="nmSetTab(\'purchaser\')">'
    +'<p class="nm-dark-cta-label">PURCHASER ONLY</p>'
    +'<p class="nm-dark-cta-title">購入者限定の<br>詳細設定ガイドへ</p>'
    +'<span class="nm-btn-outline" style="margin-top:4px;">アンロック →</span></div>';
  }

  function renderPurchaserUnlocked(){
    return '<span class="nm-label">Purchaser</span>'
    +'<h2 class="nm-section-title">詳細設定ガイド</h2>'
    +'<div class="nm-gold-line"></div>'
    +'<div class="nm-card">'
    +'<p class="nm-label">RECOMMENDED SETTINGS</p>'
    +'<div class="nm-setting-grid">'
    +[["Mode","M（マニュアル）"],["Shutter","1/160"],["F値","F22〜25"],["ISO","400〜800"],["WB","フラッシュ"],["AF","1点スポット"]]
    .map(function(s){ return '<div class="nm-setting-item"><p class="nm-setting-label">'+s[0]+'</p><p class="nm-setting-value">'+s[1]+'</p></div>'; }).join("")
    +'</div>'
    +'<div style="background:#f0ede7;padding:12px;border-radius:8px;font-size:12px;color:#555;line-height:1.8;">⚠ バリアングルを全開にし、口腔内と平行に構えてください。</div>'
    +'</div>'
    +'<div class="nm-card">'
    +'<p class="nm-label">9-SHOT PROTOCOL</p>'
    +["正面","右上","右下","左上","左下","上顎（ミラー）","前歯あおり","下顎（ミラー）","正面半開口"]
    .map(function(s,i){ return '<div class="nm-step"><span class="nm-step-num">0'+(i+1)+'</span><span style="font-size:13px;color:#333;">'+s+'</span></div>'; }).join("")
    +'</div>'
    +'<div class="nm-dark-cta" onclick="nmSetTab(\'wireless\')">'
    +'<p class="nm-dark-cta-label">WIRELESS CONNECT PRO</p>'
    +'<h3 class="nm-dark-cta-title">撮った瞬間、<br><em style="color:#c9a96e;font-style:italic;">すべてが自動になる。</em></h3>'
    +'<p class="nm-dark-cta-body">SDカードを抜く作業をゼロに。撮影後10秒でスライドが自動完成し、患者コンサルの質が根本から変わります。</p>'
    +'<div class="nm-features"><span class="nm-feature">★ 自動転送</span><span class="nm-feature">★ AI品質チェック</span><span class="nm-feature">★ スライド自動生成</span></div>'
    +'<button class="nm-btn-gold">詳細を見る →</button></div>';
  }

  function renderWirelessLocked(){
    return '<div style="background:#0a0a0a;border-radius:12px;padding:24px;margin-bottom:16px;">'
    +'<p class="nm-label" style="color:rgba(201,169,110,0.5);">WIRELESS CONNECT PRO</p>'
    +'<h2 style="font-family:\'Cormorant Garamond\',serif;font-size:22px;color:#f5f2ee;font-weight:300;line-height:1.3;margin-bottom:16px;">撮影した瞬間、<br><em style="color:#c9a96e;">すべてが自動になる。</em></h2>'
    +'<div style="position:relative;">'
    +'<div class="nm-blurred">'
    +["NASへFTP自動転送（1〜2秒）","AI品質チェック（ぼけ・露出・ミラー曇り）","Googleスライド自動生成","患者フォルダ自動作成","iPadへのリアルタイム通知"]
    .map(function(f){ return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;"><span style="color:#c9a96e;">✓</span><span style="font-size:13px;color:#f5f2ee;">'+f+'</span></div>'; }).join("")
    +'</div>'
    +'<div class="nm-locked-overlay"><div class="nm-locked-badge">🔒 LOCKED</div></div>'
    +'</div></div>'
    +renderLock("wireless","アンロックコードを入力","WirelessConnect Pro のアクセスコードを<br>入力してください。")
    +'<div class="nm-purchase-note"><p>コードをお持ちでない方は<br>WirelessConnect Pro Setをご購入ください。</p>'
    +'<a href="https://nostalgista.co.jp/?page_id=10346" class="nm-btn-outline">詳細・購入はこちら →</a></div>';
  }

  function renderWirelessUnlocked(){
    return '<span class="nm-label">Wireless Pro</span>'
    +'<h2 class="nm-section-title">運用マニュアル</h2>'
    +'<div class="nm-gold-line"></div>'
    +'<div class="nm-card">'
    +'<p class="nm-label">SETUP FLOW</p>'
    +[["01","NASをLANに接続","UGREEN NASのLANケーブルをルーターに挿す。電源ON後、約1分で起動完了。"],
      ["02","カメラのFTP設定","Z50IIのネットワーク設定からNASのIPアドレスを入力。自動転送をONに。"],
      ["03","QRで患者フォルダ作成","アプリで患者番号を入力→QRを表示→カメラで撮影。フォルダが自動生成される。"],
      ["04","撮影→自動転送","シャッターを押した瞬間、NASへ転送開始。1〜2秒でiPadに通知が届く。"]
    ].map(function(s){ return '<div class="nm-step"><span class="nm-step-num">'+s[0]+'</span>'
      +'<div><p class="nm-step-title">'+s[1]+'</p><p class="nm-step-body">'+s[2]+'</p></div></div>'; }).join("")
    +'</div>'
    +'<div class="nm-card" style="background:#f0ede7;">'
    +'<p class="nm-label">TROUBLESHOOTING</p>'
    +'<p style="font-size:12px;color:#555;line-height:2;">転送できない場合はIPアドレスを確認。漢字フォルダは使用不可。ルーターは二重ルーターを避けブリッジモードに設定してください。</p>'
    +'</div>';
  }

  function renderLock(target, title, subtitle){
    return '<div class="nm-lock-box">'
    +'<div class="nm-lock-icon">🔒</div>'
    +'<h3 class="nm-lock-title">'+title+'</h3>'
    +'<p class="nm-lock-sub">'+subtitle+'</p>'
    +'<input class="nm-input" id="nm-code-input" type="text" placeholder="コードを入力">'
    +'<button class="nm-btn-black" onclick="nmTryUnlock(\''+target+'\')">認証する</button>'
    +'<div id="nm-msg"></div>'
    +'</div>';
  }

  // 初期レンダリング
  render();
})();
</script>
